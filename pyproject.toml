[project]
name = "hn-mcp"
dynamic = ["version"]
description = "MCP Server for Hacker News - Tools, Resources, and Prompts with async httpx and caching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Guillaume Fortaine", email = "guillaume.fortaine+github@machinemates.ai" },
    { name = "Ricky (original)", email = "ricky.ediga@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "hacker-news",
    "hackernews",
    "hn",
    "fastmcp",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    # FastMCP for clean decorator-based MCP patterns (3.0b1 has resources/prompts support)
    "fastmcp>=2.0.0",
    # Async HTTP client
    "httpx>=0.28.0",
    # HTML parsing for article content extraction
    "beautifulsoup4>=4.12.0",
    # HTML to Markdown conversion (like GeorgeNance's turndown)
    "markdownify>=0.14.1",
    # Time-based caching with TTL support
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/machinemates-ai/hn-mcp"
Documentation = "https://github.com/machinemates-ai/hn-mcp#readme"
Repository = "https://github.com/machinemates-ai/hn-mcp"
Issues = "https://github.com/machinemates-ai/hn-mcp/issues"

[project.scripts]
# Backward compatible entry point - matches original erithwik/mcp-hn
mcp-hn = "mcp_hn:main"
# Alias for convenience
hn-mcp = "mcp_hn:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# Package name matches original for backward compatibility
packages = ["src/mcp_hn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
